name: RedGuo Android 4.4 codec build
on:
  push:
    branches: [redguo-android44-codec-probe]
    paths:
      - 'redguo-android44/**'
      - '.github/workflows/redguo-android44.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu runner already provides the Android command-line tools.
      # The obsolete "tools" SDK package requested by setup-android@v3
      # causes an early build failure on this runner.
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate independently created codec test clips
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p redguo-android44/app/src/main/assets
          for spec in 'h264 640x360 libx264' 'hevc 640x360 libx265' 'hevc 1280x720 libx265'; do
            read -r kind size encoder <<< "$spec"
            suffix=$(echo "$size" | cut -d x -f 2)
            echo "::group::Encoding $kind ${size}"
            codec_opts=()
            if [[ "$encoder" == "libx265" ]]; then codec_opts=(-x265-params "pools=1:frame-threads=1:wpp=0:log-level=error"); fi
            timeout 120s ffmpeg -hide_banner -loglevel error -nostdin -y -f lavfi -i "testsrc2=duration=3:size=$size:rate=10" -f lavfi -i "sine=frequency=440:duration=3" -t 3 -c:v "$encoder" -preset ultrafast -pix_fmt yuv420p -threads 1 "${codec_opts[@]}" -c:a aac -b:a 48k "redguo-android44/app/src/main/assets/${kind}_${suffix}.mp4"
            echo "::endgroup::"
          done
          ls -lh redguo-android44/app/src/main/assets/
      - name: Build debug APK
        run: gradle -p redguo-android44 --no-daemon :app:assembleDebug
      - name: Validate API 19 APK, ARM32 libraries, and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=redguo-android44/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/redguo-info.txt
          grep -q "sdkVersion:'19'" /tmp/redguo-info.txt
          unzip -l "$APK" | tee /tmp/redguo-files.txt
          grep -Eq 'lib/armeabi-v7a/.*\.so' /tmp/redguo-files.txt
          for name in h264_360 hevc_360 hevc_720; do grep -q "assets/${name}.mp4" /tmp/redguo-files.txt; done
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --min-sdk-version 19 "$APK" | tee /tmp/redguo-signing.txt
          grep -q 'Verified using v1 scheme.*true' /tmp/redguo-signing.txt
          sha256sum "$APK" > redguo-android44/app/build/outputs/apk/debug/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RedGuoTV-Android44-codec-v0.4
          path: redguo-android44/app/build/outputs/apk/debug/
          if-no-files-found: warn
