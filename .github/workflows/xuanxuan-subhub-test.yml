name: Xuanxuan Subscription Hub Tests
on:
  push:
    branches: [xuanxuan-sub-hub]
    paths:
      - 'subhub/**'
      - '.github/workflows/xuanxuan-subhub-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static check and unit tests (no network proxy or deployment)
        working-directory: subhub
        run: npm run check
