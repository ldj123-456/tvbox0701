<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轩轩 · 私人订阅管理</title><style>:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}body{max-width:720px;margin:10vh auto;padding:24px;line-height:1.7}h1{font-size:28px}section{border:1px solid #9995;border-radius:14px;padding:20px;margin-top:20px}code{background:#9992;border-radius:5px;padding:3px 6px}small{opacity:.7}</style></head><body><h1>轩轩 · 私人节点订阅</h1><p>订阅生成和真实代理出口彼此独立。此网站<strong>不提供代理转发服务</strong>。</p><section><strong>服务运行状态</strong><p id="status">检测中...</p></section><section><strong>接口说明</strong><p><code>GET /api/health</code> 检查服务状态</p><p><code>GET /api/admin/nodes</code> 获取配置（需要管理员授权）</p><p><code>PUT /api/admin/nodes</code> 保存节点配置（需要管理员授权）</p><p><code>GET /sub/&lt;私人令牌&gt;?protocol=default&amp;region=US-LA</code> 下载美国洛杉矶地区订阅</p><small>仅在配置真实后端后发布订阅；空配置不会生成假节点。请勿分享令牌。</small></section><script>fetch('/api/health').then(x=>x.json()).then(x=>{document.querySelector('#status').textContent=x.ok?(x.storageReady?'运行正常 · 已配置 '+x.configuredNodes+' 条节点':'管理页面正常 · 等待连接存储'):'服务异常'}).catch(()=>{document.querySelector('#status').textContent='服务请求失败'})</script></body></html>
